<!DOCTYPE html>
<html>
<head>
    <title> animal List</title>
</head>
<body>

    <h2>animal List</h2>

    <ul id="animal List"></ul>

    <script>
    let animal = ["DOG", "CAT", "MONKEY", "ELEPHENT", "COW"];

    let list = document.getElementById("animalList");

    for (let i = 0; i < animal.length; i++)
     {
        list.innerHTML += "<li>" + animal[i] + "</li>";
    }
    </script>

</body>
</html>
